version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # zizmor dependabot-cooldown: never take a day-0 release; a week of soak
    # time is cheap insurance against a compromised upstream publish.
    cooldown:
      default-days: 7
    # Conventional-Commit prefix so dependabot's commits pass the commitlint
    # check; `chore` is a non-releasing type, so these bumps never cut a release.
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    groups:
      analyzers:
        patterns:
          - "StyleCop.Analyzers"
          - "Meziantou.Analyzer"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    groups:
      github-actions:
        patterns:
          - "*"
