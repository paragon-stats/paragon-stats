name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # required check: a cancelled run must still report (#14)

jobs:
  build:
    strategy:
      fail-fast: false  # let both OS legs report even if one fails (#22)
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0  # MinVer derives the version from git history + tags
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet tool restore
      - name: Check console output encoding
        if: matrix.os == 'ubuntu-latest'  # OS-invariant scan - run once, after restore
        run: dotnet run scripts/dev/check-encoding.cs
      - run: dotnet format --verify-no-changes --severity error --no-restore
      - run: dotnet build --no-restore
      # Collect coverage as Visual Studio XML — the format SonarQube Cloud consumes
      # via sonar.cs.vscoveragexml.reportsPaths (#23). dotnet-coverage supports the
      # Microsoft.Testing.Platform runner; coverlet.collector / OpenCover do not.
      - name: Test with coverage
        run: dotnet tool run dotnet-coverage collect "dotnet test --no-build" -f xml -o coverage.xml
      - name: Coverage report
        run: >
          dotnet tool run reportgenerator -reports:coverage.xml
          -targetdir:coveragereport
          -reporttypes:"MarkdownSummaryGithub;JsonSummary"
          -assemblyfilters:"-*.Tests.dll"
          -classfilters:"-System.Text.RegularExpressions.Generated.*;-ParagonStats.Core.Config.AppConfigContext"
      - name: Publish coverage summary
        if: always()
        run: if (Test-Path coveragereport/SummaryGithub.md) { Get-Content coveragereport/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY }
      - name: Coverage gate
        env:
          MIN_COVERAGE: '100'  # every human-written line; generated regex internals are class-filtered (#37)
        run: |
          $s = (Get-Content coveragereport/Summary.json -Raw | ConvertFrom-Json).summary
          if ($null -eq $s.linecoverage -or $s.coverablelines -eq 0) {
            Write-Host '::notice::No production code to cover yet — coverage gate passes (bootstrap).'
            exit 0
          }
          $cov = [double]$s.linecoverage
          $min = [double]$env:MIN_COVERAGE
          Write-Host "Line coverage: $cov% (gate: >= $min%)"
          if ($cov -lt $min) {
            Write-Error "Coverage $cov% is below the $min% gate."
            exit 1
          }

  # The only check that exercises what users actually download (#236). Every
  # other test in this repo runs in-process against CliRunner, so native AOT
  # trimming failures and CLI surface regressions are invisible to them - four
  # releases shipped with no --help before anyone ran the artifact. win-x64 only,
  # because that is the single RuntimeIdentifier the release publishes.
  binary:
    name: binary
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0  # MinVer stamps the version the banner and --version print
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet publish src/ParagonStats.Cli -c Release -r win-x64
      - name: Verify the published binary against the goldens
        run: >
          dotnet run scripts/dev/verify-binary.cs --
          src/ParagonStats.Cli/bin/Release/net10.0/win-x64/publish/ParagonStats.Cli.exe
