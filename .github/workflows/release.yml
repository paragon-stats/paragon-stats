name: release

on:
  push:
    branches: [main]
  # Retry path: complete a release whose publish leg failed - the tag exists
  # but the Release is missing or still a draft. A published release is
  # immutable and final; one already carrying its asset no-ops.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag whose release needs completing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # The one deliberate credential-persisting checkout in this repo: the
      # release action pushes the signed tag over git. zizmor's artipacked
      # finding is ignored for this file in .github/linters/zizmor.yaml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0  # semantic-release and MinVer need the full tag history
      # Tag-only python-semantic-release: main is PR-only with required
      # signatures, so no bot commit ever lands. Merging a feat:/fix:/perf:/
      # security:/revert: branch commit cuts one automatically; other types
      # cut nothing. vcs-release is off because this repo's releases are
      # immutable: the publish job below creates the Release itself - draft,
      # binary attached, then published - so it is born complete.
      - id: release
        uses: paragon-stats/github-actions/release@8e164c6001e7a28bf2b06e6c528f97cda9af37cb  # v2.2.1
        with:
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          vcs-release: 'false'

  # Same-workflow chaining is what lets GITHUB_TOKEN work end to end: a
  # Release created by it never fires other workflows, so the publish leg
  # rides the same run instead of listening for a release event.
  publish:
    needs: release
    # !cancelled() lets the dispatch path run even though `release` is
    # skipped on workflow_dispatch.
    if: ${{ !cancelled() && (needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch') }}
    # AOT cannot cross-compile; win-x64 is the only ship target (PRD).
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release.outputs.tag }}
          fetch-depth: 0  # MinVer stamps the version from the tag at HEAD
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - name: publish win-x64 AOT
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'failed=$?; printf "::error::the AOT publish failed at line %s (exit %s) running: %s\n" "$LINENO" "$failed" "$BASH_COMMAND" >&2' ERR
          dotnet publish src/ParagonStats.Cli -c Release -r win-x64
          cp src/ParagonStats.Cli/bin/Release/net10.0/win-x64/publish/ParagonStats.Cli.exe paragon-stats-win-x64.exe
      # Releases here are immutable: born complete or not at all. A draft
      # accepts assets and can be deleted for a retry; publication freezes it.
      - name: create the release with its asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          # A step that dies without saying why costs more than the bug that
          # killed it. This one exited 1 in five seconds with no output at all:
          # the failing command was a silent grep, and anything printed inside
          # the notes block below lands in the notes file rather than the log.
          # stderr escapes that redirect, so the trap reports there - naming the
          # line, the exit status and the command that produced it. -E carries
          # the trap into command substitutions, which is where most of the work
          # in this step happens (#257).
          trap 'failed=$?; printf "::error::creating the release failed at line %s (exit %s) running: %s\n" "$LINENO" "$failed" "$BASH_COMMAND" >&2' ERR
          # One probe answers both questions (published? with which assets?).
          # Only a real 404 means no published release; any other failure
          # must not fall through to the guards below.
          rc=0
          published_assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '[.assets[].name] | join(" ")' 2>&1)" || rc=$?
          if [ "$rc" -eq 0 ]; then
            case " $published_assets " in
              *" paragon-stats-win-x64.exe "*)
                echo "release $TAG is already published with its asset; nothing to do"
                exit 0
                ;;
              *)
                echo "::error::release $TAG is already published without its asset; immutable releases accept no further uploads"
                exit 1
                ;;
            esac
          elif ! printf '%s' "$published_assets" | grep -q "HTTP 404"; then
            echo "::error::probing release $TAG failed: $published_assets"
            exit 1
          fi
          # The REST by-tag endpoint never returns drafts, and porcelain
          # resolves only one draft per tag while several can share a
          # tag_name - so stale drafts from failed runs are enumerated and
          # deleted by id.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
              echo "deleted stale draft $id"
            done
          # One sorted tag list drives both the notes baseline and the Latest
          # decision. Without an explicit baseline the generated notes anchor
          # on the newest published release - wrong for a back-filled retry.
          tags="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname)"
          prev="$(printf '%s\n' "$tags" | awk -v t="$TAG" 'found { print; exit } $0 == t { found=1 }')"
          highest="$(printf '%s\n' "$tags" | awk 'NR == 1')"
          # GitHub's generator lists merged PULL REQUESTS, so a release that
          # merged one PR reads as a single line however much landed inside
          # it. Every commit is on main, so the notes lead with the commits,
          # grouped by Conventional Commit type and each carrying the issues
          # its message references, and keep the generated PR links underneath.
          git log --no-merges --reverse --format='%h|%s' "${prev:+$prev..}$TAG" > commits.txt
          {
            printf '## Changes\n\n'
            for spec in feat:Features fix:Fixes security:Security perf:Performance revert:Reverts refactor:Refactoring test:Tests docs:Documentation ci:CI build:Build chore:Chores; do
              : > section.txt
              while IFS='|' read -r sha subject; do
                if [ "${subject%%[(:]*}" != "${spec%%:*}" ]; then
                  continue
                fi
                # Issue references live in the message body (Refs/Closes), so
                # a reader can get from a release line to the work it answers.
                # grep exits 1 when it matches nothing, and under pipefail that
                # took the whole step down: one commit citing no issue - which
                # Conventional Commits, commitlint and the commit style guide
                # all permit - failed v0.7.0's publish leg after its tag was
                # already cut, and silently, because this block redirects
                # stdout into the notes file (#257).
                issues="$(git show -s --format='%B' "$sha" | { grep -oE '#[0-9]+' || :; } | sort -u -V | paste -sd' ' -)"
                printf -- '- %s (%s)%s\n' "${subject#*: }" "$sha" "${issues:+ - ${issues}}" >> section.txt
              done < commits.txt
              if [ -s section.txt ]; then
                printf '### %s\n' "${spec#*:}"
                cat section.txt
                printf '\n'
              fi
            done
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" ${prev:+-f previous_tag_name="$prev"} --jq .body
          } > release-notes.md
          gh release create "$TAG" paragon-stats-win-x64.exe --draft --verify-tag --title "$TAG" --notes-file release-notes.md
          # Publishing a back-filled older version must not steal the Latest
          # badge, which also feeds /releases/latest binary downloads.
          if [ "$TAG" = "$highest" ]; then
            gh release edit "$TAG" --draft=false --latest
          else
            gh release edit "$TAG" --draft=false --latest=false
          fi
