name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The one deliberate credential-persisting checkout in this repo: the
      # release action pushes the signed tag over git. zizmor's artipacked
      # finding is ignored for this file in .github/linters/zizmor.yaml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0  # semantic-release and MinVer need the full tag history
      # Tag-only python-semantic-release: main is PR-only with required
      # signatures, so no bot commit ever lands - the release IS the signed
      # tag plus the GitHub Release. Merging a feat:/fix:/perf:/security:/
      # revert: branch commit cuts one automatically; other types cut nothing.
      - id: release
        uses: paragon-stats/github-actions/release@e2863b59ed1759f033458bb2c61d57d5eaaeaea5  # v2.1.1
        with:
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
