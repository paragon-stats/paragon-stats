name: release

on:
  push:
    branches: [main]
  # Re-publish path: attach assets to an existing release without cutting a
  # new version (a failed upload must never require a new tag).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to (re)publish assets for
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # The one deliberate credential-persisting checkout in this repo: the
      # release action pushes the signed tag over git. zizmor's artipacked
      # finding is ignored for this file in .github/linters/zizmor.yaml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0  # semantic-release and MinVer need the full tag history
      # Tag-only python-semantic-release: main is PR-only with required
      # signatures, so no bot commit ever lands. Merging a feat:/fix:/perf:/
      # security:/revert: branch commit cuts one automatically; other types
      # cut nothing. vcs-release is off because this repo's releases are
      # immutable: the publish job below creates the Release itself - draft,
      # binary attached, then published - so it is born complete.
      - id: release
        uses: paragon-stats/github-actions/release@c76541e25f76b82f97d2bc23e381eff7c4bd5d9f  # v2.1.3
        with:
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          vcs-release: 'false'

  # Same-workflow chaining is what lets GITHUB_TOKEN work end to end: a
  # Release created by it never fires other workflows, so the publish leg
  # rides the same run instead of listening for a release event.
  publish:
    needs: release
    # !cancelled() lets the dispatch path run even though `release` is
    # skipped on workflow_dispatch.
    if: ${{ !cancelled() && (needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch') }}
    # AOT cannot cross-compile; win-x64 is the only ship target (PRD).
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release.outputs.tag }}
          fetch-depth: 0  # MinVer stamps the version from the tag at HEAD
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - name: publish win-x64 AOT
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/ParagonStats.Cli -c Release -r win-x64
          cp src/ParagonStats.Cli/bin/Release/net10.0/win-x64/publish/ParagonStats.Cli.exe paragon-stats-win-x64.exe
      # Releases here are immutable: born complete or not at all. A draft
      # accepts assets and can be deleted for a retry; publication freezes it.
      - name: create the release with its asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          if [ "$state" = "false" ]; then
            echo "::error::release $TAG is already published; immutable releases accept no further assets"
            exit 1
          elif [ "$state" = "true" ]; then
            gh release delete "$TAG" --yes  # stale draft from a failed run
          fi
          gh release create "$TAG" paragon-stats-win-x64.exe --draft --verify-tag --title "$TAG" --generate-notes
          gh release edit "$TAG" --draft=false
