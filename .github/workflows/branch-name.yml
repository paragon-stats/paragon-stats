name: branch-name

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: branch-name-${{ github.ref }}
  cancel-in-progress: false  # required check: a cancelled run must still report (#14)

jobs:
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Shared with the other org repos so the convention cannot drift between
      # them; the accepted type set comes from the shared repo's commit-types.txt
      # fact-set (the same file the vendored commit-message check reads).
      - uses: paragon-stats/github-actions/branch-name@8e164c6001e7a28bf2b06e6c528f97cda9af37cb  # v2.2.1
        with:
          branch: ${{ github.event.pull_request.head.ref }}
