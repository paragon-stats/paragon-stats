name: branch-name

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: branch-name-${{ github.ref }}
  cancel-in-progress: false  # required check: a cancelled run must still report (#14)

jobs:
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Shared with the other org repos so the convention cannot drift between
      # them; the accepted type set is the action's `types` input default.
      - uses: paragon-stats/github-actions/branch-name@a6798deeb62043418baff10a0cf45499226d8f35  # v1.0.0
        with:
          branch: ${{ github.event.pull_request.head.ref }}
