name: commitlint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: false  # required check: a cancelled run must still report (#14)

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0  # need the full PR commit range
      # The validator is the shared bash script from paragon-stats/github-actions,
      # vendored at v2.0.2 so the local Husky.Net commit-msg hook runs the very
      # same file. This step pins that equivalence: the vendored copy must stay
      # byte-identical to the tagged upstream, or the build fails.
      - name: Verify vendored check-commit-message matches upstream v2.0.2
        shell: bash
        run: |
          base="https://raw.githubusercontent.com/paragon-stats/github-actions/f4ba44830e3f80ae6626394fabd383bbf97e1c2a"
          curl -fsSL --proto '=https' "$base/check-commit-message/check-commit-message.sh" -o "$RUNNER_TEMP/upstream.sh"
          curl -fsSL --proto '=https' "$base/commit-types.txt" -o "$RUNNER_TEMP/upstream-types.txt"
          drift=0
          diff -u "$RUNNER_TEMP/upstream.sh" scripts/git/check-commit-message.sh || drift=1
          diff -u "$RUNNER_TEMP/upstream-types.txt" scripts/git/commit-types.txt || drift=1
          if [ "$drift" -ne 0 ]; then
            echo "::error::scripts/git/ has drifted from paragon-stats/github-actions@f4ba448 (v2.0.2). Never edit the vendored copy; re-vendor from the new upstream pin and bump this SHA."
            exit 1
          fi
      # D2 applied here: pyproject.toml restates the bump mapping for the
      # release tooling; the vendored commit-types.txt stays the source of
      # truth, and drift between them fails this required check.
      - name: Verify the release bump mapping matches the fact-set
        shell: bash
        run: |
          python3 - <<'PY'
          import sys, tomllib

          types = {}
          bad = [c[0] for c in (l.split("#")[0].split() for l in open("scripts/git/commit-types.txt")) if len(c) == 1]
          if bad:
              print(f"::error::commit-types.txt rows missing the bump column: {', '.join(bad)}")
              sys.exit(1)
          for line in open("scripts/git/commit-types.txt"):
              cols = line.split("#")[0].split()
              if cols:
                  types[cols[0]] = cols[1]

          opts = tomllib.load(open("pyproject.toml", "rb"))["tool"]["semantic_release"]["commit_parser_options"]
          checks = {
              "allowed_tags": sorted(types),
              "minor_tags": sorted(t for t, b in types.items() if b == "minor"),
              "patch_tags": sorted(t for t, b in types.items() if b == "patch"),
          }
          rc = 0
          for key, want in checks.items():
              got = sorted(opts[key])
              if got != want:
                  print(f"::error::pyproject {key} drifted: {got} != commit-types.txt {want}")
                  rc = 1
          sys.exit(rc)
          PY
      - name: Validate PR commit messages
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/commit-msg.txt"
            if ! MESSAGE_FILE="$RUNNER_TEMP/commit-msg.txt" \
                 CHANGED_PATHS="$(git diff-tree --no-commit-id --name-only -r "$sha")" \
                 bash scripts/git/check-commit-message.sh; then
              echo "::error::Bad commit (bad format, or a release-triggering type without a src/ change): $(git log -1 --format='%h %s' "$sha")"
              fail=1
            fi
          done
          exit "$fail"
      # Merge commits are the only allowed merge method, so the PR title is no
      # commit's subject and the release tooling parses branch commits instead.
      # The title still heads the PR page and the pr-summary block, so it keeps
      # the same rules - including the release-type-needs-src guard.
      - name: Validate the PR title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          MESSAGE_FILE="$RUNNER_TEMP/pr-title.txt" \
            CHANGED_PATHS="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")" \
            bash scripts/git/check-commit-message.sh
